services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    depends_on: [api]
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
    restart: unless-stopped
